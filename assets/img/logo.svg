<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="visue-logo-title">
  <title id="visue-logo-title">Logotipo de VISUE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b8f"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
  </defs>
  <!-- Base redondeada -->
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <!-- Puente de comunicación entre dos puntos -->
  <path d="M18 17 H46" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 5" opacity=".85"/>
  <!-- Letra V construida con dos trazos (dos "dedos") -->
  <path d="M18 17 L32 46 L46 17" fill="none" stroke="url(#fg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nodos: puntos de la mano / conexión -->
  <circle cx="18" cy="17" r="4.6" fill="#5eead4" stroke="#06122b" stroke-width="1.5"/>
  <circle cx="46" cy="17" r="4.6" fill="#5eead4" stroke="#06122b" stroke-width="1.5"/>
  <circle cx="32" cy="46" r="3.4" fill="#ffffff"/>
</svg>
